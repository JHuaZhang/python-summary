name: Deploy Docs to Server

on:
  push:
    branches: [main]
  workflow_dispatch:

# 部署作业绝不能中途被杀：rsync 正在执行 --delete 时被中断（新 push 触发 concurrency 取消、或网络断开），
# 服务器都会陷入"半新半旧的混血"状态。2026-10-12 线上坏掉正是如此：rsync 半路中断后
# 线上 HTML 仍引用旧 index chunk，而 --delete 已把该 chunk 从服务器删掉，浏览器请求该 JS
# 被 nginx 兜底为 index.html → Uncaught SyntaxError: Unexpected token '<' → 全站 JS 水合失败。
# 因此重复部署一律排队等上一轮跑完，宁可多花几次构建，也不在服务器上留半成品。
concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Deploy to Server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 版本必须与本地环境对齐（2026-10 实测：pnpm 11.21.0 / Node 22.23.2）
      # lockfile(9.0) 与 pnpm-workspace.yaml(allowBuilds) 均由 pnpm 11 生成，pnpm 8 无法解析
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install

      - name: Generate Config & Knowledge
        run: pnpm run nav

      # 服务器按 /apps/<appId>/ 通用规则服务，构建必须使用对应 base 路径
      - name: Build Documentation Site
        run: BASE_PATH=/apps/python-summary/ pnpm run build

      # dist 中带冒号的文件会让 scp 识别成 host:path 导致传输失败
      - name: Clean Invalid Filenames
        run: |
          echo "🔧 清理文件名中的冒号..."
          find dist -depth -name '*:*' | while read item; do
            mv "$item" "$(echo "$item" | tr ':' '_')"
          done
          if find dist -name '*:*' | grep -q .; then
            echo "❌ 仍有包含冒号的文件"
            exit 1
          fi

      # 构建产物自检：HTML 里引用的所有 js/css/svg/png/ico 必须真实存在于 dist。
      # 2026-10-12 线上事故的损坏形态就是"HTML 引用不存在的 chunk"，在构建侧硬卡掉这类问题；
      # 同时也能兜住"冒号文件改名导致引用断裂"的边缘情况（改名虽兼容 scp 旧例，但会破坏引用）。
      - name: Verify Build Assets
        run: |
          set -euo pipefail
          echo '🔎 扫描构建产物中 HTML 的资源引用...'
          missing=0
          count=0
          while IFS= read -r ref; do
            [ -z "$ref" ] && continue
            rel="${ref#*/apps/*/}"
            count=$((count+1))
            if [ ! -f "dist/$rel" ]; then
              echo "❌ HTML 引用了构建产物中不存在的文件: $ref"
              missing=$((missing+1))
            fi
          done < <(grep -rhoE '(src|href)="[^"]+\.(js|css|svg|png|ico)"' dist --include='*.html' \
                   | sed -E 's/^(src|href)="//; s/"$//' | grep -E '^/apps/' | sort -u)
          echo "共检查 $count 个资源引用，缺失 $missing 个"
          if [ "$count" -eq 0 ]; then
            echo '❌ 一个资源引用都没扫到，HTML 结构变化导致校验失效，请更新正则'
            exit 1
          fi
          if [ "$missing" -gt 0 ]; then
            echo '❌ 存在悬空引用，阻断部署'
            exit 1
          fi
          echo '✅ HTML 引用的所有资源均存在'

      - name: Verify Build Output
        run: |
          if [ ! -f 'dist/index.html' ]; then
            echo '❌ Build output dist/index.html not found!'
            exit 1
          fi
          echo "✅ 构建完成，共 $(find dist -type f | wc -l) 个文件"

      - name: Validate Required Secrets
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          TARGET_PATH: ${{ secrets.TARGET_PATH }}
        run: |
          : "${SSH_PRIVATE_KEY:?❌ 缺少 Secret: SSH_PRIVATE_KEY（在 Settings → Secrets and variables → Actions 中配置）}"
          : "${SERVER_HOST:?❌ 缺少 Secret: SERVER_HOST}"
          : "${SERVER_USER:?❌ 缺少 Secret: SERVER_USER}"
          : "${TARGET_PATH:?❌ 缺少 Secret: TARGET_PATH（推荐 /home/zjh/project/apps/python-summary/prod）}"
          if [ "$TARGET_PATH" = "/" ]; then
            echo '❌ TARGET_PATH 不能是 /'
            exit 1
          fi
          echo '✅ Secrets 校验通过'

      # ==================== 部署到服务器 ====================

      - name: Setup SSH Connection
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Test SSH Connection
        run: |
          ssh -o BatchMode=yes "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "echo '✅ SSH 连接成功 (\$(whoami)@\$(hostname))'"

      - name: Prepare Target Directory
        run: |
          ssh -o BatchMode=yes "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" "
            mkdir -p '${{ secrets.TARGET_PATH }}'
            echo '📁 目标目录就绪: ${{ secrets.TARGET_PATH }}'
          "

      # 差量同步（内容级 md5 清单比对，跨境流量最小）—— 三种方案对比：
      #  ① --size-only      快但致命：rspress chunk hash 均为 10 字符，两次构建 HTML 长度必然相同、
      #                     内容不同（仅内嵌 hash 变化），--size-only 会永久跳过 HTML 更新
      #                    （2026-10-12 线上坏掉的直接原因，禁用）
      #  ② rsync --checksum 准但慢：对两侧全部文件做 checksum 协商，高延迟跨境链路是分钟级（历史实测，弃用）
      #  ③ md5 清单差量（现方案）：一次 ssh 取回服务器全量 md5 清单（几十 KB），本地比对后只传真实变化的文件，
      #     正确性与 ② 完全等价，跨海流量更小（清单 + 差量，零逐文件协商）。
      # 顺序保证：先传静态资源、再传 HTML、最后才清理过期文件 —— 任何时刻被打断，服务器最多处于
      # "新旧资源并存"（每份 HTML 引用的资源都完整存在），绝不会出现"HTML 引用已删/未传的 chunk"（事故形态）。
      - name: Sync Changed Files (md5 diff)
        env:
          SERVER: ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}
          TARGET_PATH: ${{ secrets.TARGET_PATH }}
        run: |
          set -euo pipefail
          SSH_CMD="ssh -o BatchMode=yes -o ServerAliveInterval=30"

          # 1) 双侧 md5 清单（行格式："<md5>  ./相对路径"）
          (cd dist && find . -type f -print0 | sort -z | xargs -0 md5sum) > local.manifest
          $SSH_CMD "$SERVER" "cd '$TARGET_PATH' && find . -type f -print0 | sort -z | xargs -0 md5sum" > server.manifest

          # 防御：路径含空格会让下方 awk 取路径错乱，硬卡人工处理
          if cut -c35- local.manifest server.manifest | grep -q ' '; then
            echo '❌ 产物文件名包含空格，差量同步逻辑不支持，请先规范产物命名'
            exit 1
          fi

          # 2) 比对：changed = 新增或内容变化；deleted = 服务器有而本地没有（过期产物）
          awk 'NR==FNR { srv[$2]=$1; next } { if (!($2 in srv) || srv[$2] != $1) print $2 }' server.manifest local.manifest > changed.raw || true
          awk 'NR==FNR { loc[$2]=1;    next } !($2 in loc)    { print $2 }'              local.manifest server.manifest > deleted.txt    || true
          grep -v '\.html$' changed.raw > changed.static.txt || true
          grep '\.html$'    changed.raw > changed.html.txt   || true

          echo "📦 静态资源变化 $(wc -l < changed.static.txt | tr -d ' ') 个，页面变化 $(wc -l < changed.html.txt | tr -d ' ') 个，待清理 $(wc -l < deleted.txt | tr -d ' ') 个"
          head -10 changed.static.txt | sed 's/^/    △ /'
          head -5  changed.html.txt   | sed 's/^/    △ …/'

          # 3a) 先传 js/css/svg 等静态资源
          if [ -s changed.static.txt ]; then
            rsync -az --whole-file --stats \
              -e "$SSH_CMD" \
              --files-from=changed.static.txt ./dist/ "$SERVER:$TARGET_PATH/"
          else
            echo 'ℹ️ 静态资源无变化，跳过'
          fi

          # 3b) 再传 HTML 页面（此时页面引用的静态资源已全部就位）
          if [ -s changed.html.txt ]; then
            rsync -az --whole-file --stats \
              -e "$SSH_CMD" \
              --files-from=changed.html.txt ./dist/ "$SERVER:$TARGET_PATH/"
          else
            echo 'ℹ️ 页面无变化，跳过'
          fi

          # 4) 传完之后再清理过期文件（先传后删：任何中断都不会让线上 HTML 指向缺失文件）
          if [ -s deleted.txt ]; then
            $SSH_CMD "$SERVER" "cd '$TARGET_PATH' && while IFS= read -r f; do rm -f -- \"\$f\"; done" < deleted.txt
            echo "🗑️ 已清理 $(wc -l < deleted.txt | tr -d ' ') 个过期文件"
          else
            echo 'ℹ️ 无过期文件需要清理'
          fi

          echo '📤 差量同步完成'

      - name: Verify Deployment
        run: |
          ssh -o BatchMode=yes "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" "
            echo '========== 部署验证 =========='
            echo '目标目录: '${{ secrets.TARGET_PATH }}
            echo '文件数量: '\$(find '${{ secrets.TARGET_PATH }}' -type f | wc -l)
            echo '目录大小: '\$(du -sh '${{ secrets.TARGET_PATH }}' | cut -f1)
            echo 'index.html: '\$([ -f '${{ secrets.TARGET_PATH }}/index.html' ] && echo OK || echo '❌ 缺失')
            echo '部署时间: '\$(date '+%Y-%m-%d %H:%M:%S')
            echo '=============================='
          "

      # 服务器端资源完整性自检（单次 ssh 内完成全部检查，无逐文件网络往返）：
      # HTML 引用的 js/css/svg/png/ico 必须真实存在于磁盘。任何 .js 缺失时浏览器请求会被
      # nginx 兜底成 index.html，解析即报 SyntaxError: Unexpected token '<'（2026-10-12 事故前端表象）。
      # 校验不过 = 部署不完整/混血，直接红掉让作者知晓，绝不带病上线。
      - name: Post-deploy Integrity Check
        env:
          SERVER: ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}
          TARGET_PATH: ${{ secrets.TARGET_PATH }}
        run: |
          ssh -o BatchMode=yes "$SERVER" "TARGET_PATH='$TARGET_PATH' bash -s" <<'REMOTE'
          set -u
          cd "$TARGET_PATH" || { echo '❌ 目标目录不存在'; exit 1; }
          missing=0
          count=0
          while IFS= read -r rel; do
            [ -z "$rel" ] && continue
            count=$((count+1))
            if [ ! -f "$rel" ]; then
              echo "❌ 服务器上缺少 HTML 引用的文件: $rel"
              missing=$((missing+1))
            fi
          done < <(grep -rhoE '(src|href)="[^"]+\.(js|css|svg|png|ico)"' . --include='*.html' \
                   | sed -E 's/^(src|href)="//; s/"$//' | grep -E '^/apps/' | sed -E 's#^/apps/[^/]+/##' | sort -u)
          echo "服务器资源引用检查：共 $count 个，缺失 $missing 个"
          if [ "$count" -eq 0 ]; then
            echo '❌ 一个资源引用都没扫到，校验逻辑可能失效，请检查'
            exit 1
          fi
          exit "$missing"
          REMOTE
          echo '✅ 服务器上所有 HTML 引用的资源均存在'
