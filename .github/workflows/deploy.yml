name: Deploy Docs to Server

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-server
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & Deploy to Server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 版本必须与本地环境对齐（2026-10 实测：pnpm 11.21.0 / Node 22.23.2）
      # lockfile(9.0) 与 pnpm-workspace.yaml(allowBuilds) 均由 pnpm 11 生成，pnpm 8 无法解析
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install

      - name: Generate Config & Knowledge
        run: pnpm run nav

      # 服务器按 /apps/<appId>/ 通用规则服务，构建必须使用对应 base 路径
      - name: Build Documentation Site
        run: BASE_PATH=/apps/python-summary/ pnpm run build

      # dist 中带冒号的文件会让 scp 识别成 host:path 导致传输失败
      - name: Clean Invalid Filenames
        run: |
          echo "🔧 清理文件名中的冒号..."
          find dist -depth -name '*:*' | while read item; do
            mv "$item" "$(echo "$item" | tr ':' '_')"
          done
          if find dist -name '*:*' | grep -q .; then
            echo "❌ 仍有包含冒号的文件"
            exit 1
          fi

      - name: Verify Build Output
        run: |
          if [ ! -f 'dist/index.html' ]; then
            echo '❌ Build output dist/index.html not found!'
            exit 1
          fi
          echo "✅ 构建完成，共 $(find dist -type f | wc -l) 个文件"

      - name: Validate Required Secrets
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          TARGET_PATH: ${{ secrets.TARGET_PATH }}
        run: |
          : "${SSH_PRIVATE_KEY:?❌ 缺少 Secret: SSH_PRIVATE_KEY（在 Settings → Secrets and variables → Actions 中配置）}"
          : "${SERVER_HOST:?❌ 缺少 Secret: SERVER_HOST}"
          : "${SERVER_USER:?❌ 缺少 Secret: SERVER_USER}"
          : "${TARGET_PATH:?❌ 缺少 Secret: TARGET_PATH（推荐 /home/zjh/project/apps/python-summary/prod）}"
          if [ "$TARGET_PATH" = "/" ]; then
            echo '❌ TARGET_PATH 不能是 /'
            exit 1
          fi
          echo '✅ Secrets 校验通过'

      # ==================== 部署到服务器 ====================

      - name: Setup SSH Connection
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Test SSH Connection
        run: |
          ssh -o BatchMode=yes "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" \
            "echo '✅ SSH 连接成功 (\$(whoami)@\$(hostname))'"

      - name: Prepare Target Directory
        run: |
          ssh -o BatchMode=yes "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" "
            mkdir -p '${{ secrets.TARGET_PATH }}'
            echo '📁 目标目录就绪: ${{ secrets.TARGET_PATH }}'
          "

      # 差量同步（跨境链路调优）：runner 在海外 → 国内服务器，必须避免逐文件网络往返
      # --size-only  按"文件名+大小"判断变化：在文件列表阶段一次性完成，零逐文件往返
      #              （-c/--checksum 要对每个文件单独协商，跨境几百文件=几分钟纯协商，禁用；
      #               CI 每次构建 mtime 全新，默认按时间戳判断会退化成全量，同样不可用）
      # --whole-file 变化的文件整体传输，跳过 rsync delta 块协商（高延迟链路标准做法）
      # --delete     目标端多出的旧文件自动清理（旧 hash 产物不堆积）
      # ⚠️ 源路径 ./dist/ 的尾斜杠不能少：不带斜杠会把 dist 目录本身塞进目标，变成 prod/dist/
      - name: Deploy with rsync
        run: |
          echo "🚀 rsync 差量同步到 ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.TARGET_PATH }}/"
          rsync -az --size-only --whole-file --delete --stats \
            -e "ssh -o BatchMode=yes" \
            ./dist/ \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.TARGET_PATH }}/"
          echo '📤 同步完成'

      - name: Verify Deployment
        run: |
          ssh -o BatchMode=yes "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" "
            echo '========== 部署验证 =========='
            echo '目标目录: '${{ secrets.TARGET_PATH }}
            echo '文件数量: '\$(find '${{ secrets.TARGET_PATH }}' -type f | wc -l)
            echo '目录大小: '\$(du -sh '${{ secrets.TARGET_PATH }}' | cut -f1)
            echo 'index.html: '\$([ -f '${{ secrets.TARGET_PATH }}/index.html' ] && echo OK || echo '❌ 缺失')
            echo '部署时间: '\$(date '+%Y-%m-%d %H:%M:%S')
            echo '=============================='
          "
